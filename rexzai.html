<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#060b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>RexzAI — Nemotron Ultra</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050b17;
            --bg-primary: #0a1322;
            --bg-secondary: #0f1a2e;
            --bg-tertiary: #152238;
            --bg-input: #0d1829;
            --text-primary: #e3e9f2;
            --text-secondary: #8899b5;
            --text-muted: #556580;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-soft: rgba(59, 130, 246, 0.08);
            --accent-glow: rgba(59, 130, 246, 0.18);
            --user-bubble: #0f2847;
            --user-bubble-border: #1a4a7a;
            --ai-bubble: #0d1522;
            --ai-bubble-border: #1a2a3f;
            --border: #1a2a3f;
            --danger: #ef4444;
            --success: #22c55e;
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html { height: 100%; overflow: hidden; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(ellipse at 20% 10%, rgba(59, 130, 246, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(96, 165, 250, 0.04) 0%, transparent 55%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            border-left: 1px solid rgba(59, 130, 246, 0.05);
            border-right: 1px solid rgba(59, 130, 246, 0.05);
        }

        @media (min-width: 481px) {
            body { padding: 14px; }
            .app-container {
                border-radius: 26px;
                height: calc(100% - 28px);
                max-height: 900px;
                border: 1px solid rgba(59, 130, 246, 0.08);
            }
        }

        /* Header */
        .header {
            background: rgba(10, 19, 34, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 11px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            flex-shrink: 0;
            min-height: 56px;
        }

        .header-pfp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            overflow: hidden;
            border: 2px solid rgba(59, 130, 246, 0.25);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
            background: var(--bg-tertiary);
        }

        .header-pfp img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-info { flex: 1; min-width: 0; }
        .header-title { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.2px; display: flex; align-items: center; gap: 6px; }
        .header-badge { display: inline-flex; align-items: center; gap: 3px; background: rgba(59, 130, 246, 0.1); color: var(--accent-light); font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.3px; text-transform: uppercase; }
        .header-subtitle { font-size: 10.5px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .online-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); animation: pulseDot 2s ease-in-out infinite; box-shadow: 0 0 5px rgba(34, 197, 94, 0.4); }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.5); }
        }

        .header-actions { display: flex; gap: 4px; }
        .icon-btn {
            width: 34px; height: 34px; border-radius: 10px;
            background: transparent; border: 1px solid transparent;
            color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .icon-btn:active { background: var(--accent); color: #fff; border-color: var(--accent-light); transform: scale(0.9); }
        .icon-btn svg { width: 16px; height: 16px; }

        /* Chat */
        .chat-container {
            flex: 1; overflow-y: auto; padding: 12px 13px;
            display: flex; flex-direction: column; gap: 10px;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }
        .chat-container::-webkit-scrollbar { width: 2px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 10px; }

        /* Welcome */
        .welcome-wrap { text-align: center; padding: 28px 6px; animation: fadeUp 0.45s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .welcome-pfp {
            width: 60px; height: 60px; margin: 0 auto 12px;
            border-radius: 50%; overflow: hidden;
            border: 2px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.2);
            animation: float 3s ease-in-out infinite;
            background: var(--bg-tertiary);
        }
        .welcome-pfp img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .welcome-title { font-size: 21px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -0.3px; }
        .welcome-grad { background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .welcome-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; max-width: 260px; margin: 0 auto; }
        .suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; justify-content: center; }
        .chip {
            background: var(--bg-tertiary); border: 1px solid var(--border);
            padding: 8px 13px; border-radius: 18px; font-size: 11.5px;
            font-weight: 500; color: var(--text-secondary); cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .chip svg { width: 14px; height: 14px; flex-shrink: 0; }
        .chip:active { background: var(--accent); color: #fff; border-color: var(--accent-light); transform: scale(0.93); box-shadow: 0 4px 12px var(--accent-glow); }

        /* Messages */
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .message { display: flex; gap: 8px; max-width: 85%; animation: msgIn 0.28s ease; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.ai { align-self: flex-start; }
        .msg-pfp {
            width: 26px; height: 26px; border-radius: 50%;
            flex-shrink: 0; overflow: hidden;
            background: var(--bg-tertiary);
        }
        .msg-pfp img { width: 100%; height: 100%; object-fit: cover; }
        .message.user .msg-pfp { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .message.ai .msg-pfp { border: 1.5px solid var(--border); }
        .bubble {
            padding: 10px 14px; border-radius: 18px; font-size: 13px;
            line-height: 1.55; word-wrap: break-word; letter-spacing: -0.08px;
        }
        .message.user .bubble {
            background: var(--user-bubble); color: #d2def7;
            border-bottom-right-radius: 6px; border: 1px solid var(--user-bubble-border);
        }
        .message.ai .bubble {
            background: var(--ai-bubble); color: #d0d9ed;
            border-bottom-left-radius: 6px; border: 1px solid var(--ai-bubble-border);
        }
        .bubble pre {
            background: #060d18; padding: 10px; border-radius: 8px;
            overflow-x: auto; margin: 6px 0;
            font-family: 'JetBrains Mono', monospace; font-size: 11px;
            line-height: 1.5; border: 1px solid var(--border);
            -webkit-user-select: text; user-select: text;
        }
        .bubble code {
            font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
            background: rgba(59, 130, 246, 0.08); padding: 1.5px 5px;
            border-radius: 3px; color: var(--accent-light);
        }
        .bubble pre code { background: transparent; padding: 0; color: #b0bdd4; }
        .bubble strong { color: #fff; font-weight: 600; }
        .msg-meta { font-size: 9px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 3px; }
        .message.user .msg-meta { justify-content: flex-end; }

        /* Typing */
        .typing-dots { display: flex; gap: 3px; padding: 3px 0; }
        .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-light); animation: typingBounce 1.1s ease-in-out infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.14s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.28s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.2; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        /* Input */
        .input-area {
            padding: 7px 11px;
            padding-bottom: max(7px, env(safe-area-inset-bottom, 7px));
            background: rgba(10, 19, 34, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex; gap: 7px; align-items: flex-end;
            flex-shrink: 0; position: relative; z-index: 30;
        }
        .input-wrapper {
            flex: 1; background: var(--bg-input);
            border-radius: 22px; padding: 1px;
            display: flex; align-items: flex-end;
            border: 1.5px solid var(--border);
            transition: all 0.2s ease;
        }
        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        textarea {
            flex: 1; background: transparent; border: none;
            color: var(--text-primary); font-family: 'Inter', sans-serif;
            font-size: 14px; padding: 10px 13px; resize: none;
            max-height: 110px; line-height: 1.4; outline: none;
            letter-spacing: -0.08px;
            -webkit-user-select: text; user-select: text;
            caret-color: var(--accent-light);
        }
        textarea::placeholder { color: var(--text-muted); font-size: 13px; }
        .send-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--accent); border: none; color: #fff;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }
        .send-btn:active { transform: scale(0.85); }
        .send-btn:disabled { opacity: 0.35; transform: none; cursor: not-allowed; box-shadow: none; }
        .send-btn svg { width: 18px; height: 18px; }
        .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Scroll btn */
        .scroll-btn {
            position: absolute; bottom: 88px; left: 50%; transform: translateX(-50%);
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--accent); border: none; color: #fff;
            cursor: pointer; display: none; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35); z-index: 10;
            animation: fadeUp 0.3s ease;
        }
        .scroll-btn svg { width: 14px; height: 14px; }

        /* Toast */
        .toast {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: var(--bg-secondary); border: 1px solid var(--border);
            color: var(--text-primary); padding: 9px 18px;
            border-radius: 20px; font-size: 12px; font-weight: 500;
            z-index: 100; animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            white-space: nowrap; box-shadow: var(--shadow-lg);
        }
        .toast.error { border-color: rgba(239,68,68,0.3); color: #fca5a5; }
        .toast.success { border-color: rgba(34,197,94,0.3); color: #86efac; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-18px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(-50%) translateY(0); } to { opacity: 0; transform: translateX(-50%) translateY(-18px); } }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="header">
            <div class="header-pfp">
                <img src="pfp.jpg" alt="RexzAI" onerror="this.style.display='none'">
            </div>
            <div class="header-info">
                <div class="header-title">RexzAI<span class="header-badge">Nemotron</span></div>
                <div class="header-subtitle"><span class="online-dot"></span>Online · Ultra 550B</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="exportChat()" title="Export" aria-label="Export chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                </button>
                <button class="icon-btn" onclick="clearChat()" title="New Chat" aria-label="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </header>

        <!-- Chat -->
        <main class="chat-container" id="chatContainer">
            <div class="welcome-wrap" id="welcomeMsg">
                <div class="welcome-pfp">
                    <img src="pfp.jpg" alt="RexzAI" onerror="this.style.display='none'">
                </div>
                <div class="welcome-title">Halo, aku <span class="welcome-grad">RexzAI</span></div>
                <div class="welcome-desc">Ditenagai NVIDIA Nemotron Ultra 550B via OpenRouter. Tanyakan apa saja.</div>
                <div class="suggestions">
                    <span class="chip" onclick="sendSuggestion(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        Apa itu AI?
                    </span>
                    <span class="chip" onclick="sendSuggestion(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        Kode Python
                    </span>
                    <span class="chip" onclick="sendSuggestion(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        Puisi singkat
                    </span>
                    <span class="chip" onclick="sendSuggestion(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        Tips produktif
                    </span>
                </div>
            </div>
        </main>

        <!-- Scroll btn -->
        <button class="scroll-btn" id="scrollBtn" onclick="scrollToBottom()" aria-label="Scroll ke bawah">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <!-- Input -->
        <footer class="input-area" id="inputArea">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Ketik pesan..." rows="1"
                    onkeydown="handleKeyDown(event)" oninput="autoResize(this)" onfocus="onInputFocus()"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Kirim">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </footer>
    </div>

    <script>
        // ============================================================
        //  REXZAI — Elegant AI Chat
        //  Model: nvidia/nemotron-3-ultra-550b-a55b:free
        //  API: OpenRouter
        // ============================================================

        const CONFIG = {
            OPENROUTER_API_KEY: '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',
            MODEL: 'nvidia/nemotron-3-ultra-550b-a55b:free',
            APP_NAME: 'RexzAI',
            APP_URL: 'https://rexzai.app',
            MAX_TOKENS: 512,
            TEMPERATURE: 0.65,
            TOP_P: 0.85,
            SYSTEM_PROMPT: `Kamu adalah RexzAI, asisten AI cerdas dan elegan. Kamu ditenagai NVIDIA Nemotron Ultra 550B.

Kepribadian:
- Jawab dalam Bahasa Indonesia yang natural, sopan, dan tidak berlebihan
- Singkat, padat, langsung ke inti — hindari basa-basi panjang
- Gunakan bahasa yang tenang dan dewasa, bukan bahasa alay
- Jika memberi saran, berikan yang actionable dan praktis
- Untuk kode: berikan contoh bersih dengan penjelasan minimal
- Jangan gunakan emoji sama sekali — gunakan kata-kata yang tepat
- Jika tidak tahu, katakan dengan jujur tanpa bertele-tele
- Format rapi: paragraf pendek, bullet point jika perlu`
        };

        let conversationHistory = [{ role: 'system', content: CONFIG.SYSTEM_PROMPT }];
        let isProcessing = false;
        let abortController = null;

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const scrollBtn = document.getElementById('scrollBtn');
        const appContainer = document.getElementById('appContainer');

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            scrollToBottom();
            chatContainer.addEventListener('scroll', () => {
                const d = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight;
                scrollBtn.style.display = d > 120 ? 'flex' : 'none';
            });
            setTimeout(() => userInput.focus(), 500);
            console.log('RexzAI ready — Nemotron Ultra 550B');
        });

        // Keyboard handling
        function onInputFocus() {
            setTimeout(() => {
                scrollToBottom();
                document.getElementById('inputArea')?.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 350);
        }

        let lastH = window.innerHeight;
        window.addEventListener('resize', () => {
            if (window.innerHeight < lastH) setTimeout(() => { scrollToBottom(); document.getElementById('inputArea')?.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 300);
            lastH = window.innerHeight;
        });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => setTimeout(scrollToBottom, 200));
        }

        function autoResize(ta) {
            ta.style.height = 'auto';
            ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
            scrollToBottom();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            if (e.key === 'Escape' && isProcessing) cancelRequest();
        }

        function sendSuggestion(chip) {
            userInput.value = chip.textContent.trim();
            userInput.focus();
            autoResize(userInput);
        }

        function toast(msg, type = '') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            appContainer.appendChild(t);
            setTimeout(() => { if (t.parentNode) t.remove(); }, 3000);
        }

        function timeNow() {
            const n = new Date();
            return n.getHours().toString().padStart(2, '0') + ':' + n.getMinutes().toString().padStart(2, '0');
        }

        function scrollToBottom() {
            requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
        }

        function hideWelcome() {
            if (welcomeMsg && welcomeMsg.style.display !== 'none') {
                welcomeMsg.style.opacity = '0';
                welcomeMsg.style.transition = 'opacity 0.2s';
                setTimeout(() => { welcomeMsg.style.display = 'none'; }, 200);
            }
        }

        function uid() { return 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 7); }

        function escHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        function fmtMsg(text) {
            const blocks = [];
            let t = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                const i = blocks.length;
                blocks.push(code.trim());
                return `\x00CB${i}\x00`;
            });
            t = escHtml(t);
            t = t.replace(/\x00CB(\d+)\x00/g, (_, i) => `<pre><code>${escHtml(blocks[+i])}</code></pre>`);
            t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
            t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            t = t.replace(/^- (.+)$/gm, '• $1');
            t = t.replace(/\n/g, '<br>');
            return t;
        }

        function addMsg(content, isUser = false) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'ai'}`;
            div.id = uid();
            const pfp = isUser
                ? 'U'
                : '<img src="pfp.jpg" alt="RexzAI" onerror="this.style.display=\'none\'; this.parentElement.textContent=\'R\';" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
            div.innerHTML = `
                <div class="msg-pfp">${pfp}</div>
                <div style="min-width:0;">
                    <div class="bubble">${isUser ? escHtml(content) : fmtMsg(content)}</div>
                    <div class="msg-meta">${timeNow()} · ${isUser ? 'Kamu' : 'RexzAI'}</div>
                </div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="msg-pfp">
                    <img src="pfp.jpg" alt="RexzAI" onerror="this.style.display='none'; this.parentElement.textContent='R';" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                </div>
                <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function hideTyping() { const t = document.getElementById('typingIndicator'); if (t) t.remove(); }

        function setLoading(on) {
            isProcessing = on;
            sendBtn.disabled = on;
            sendBtn.innerHTML = on
                ? '<div class="spinner"></div>'
                : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
        }

        function cancelRequest() {
            if (abortController) { abortController.abort(); abortController = null; }
            setLoading(false);
            hideTyping();
            toast('Dibatalkan', 'error');
        }

        async function callAPI(userMsg) {
            abortController = new AbortController();
            const body = {
                model: CONFIG.MODEL,
                messages: [...conversationHistory, { role: 'user', content: userMsg }],
                max_tokens: CONFIG.MAX_TOKENS,
                temperature: CONFIG.TEMPERATURE,
                top_p: CONFIG.TOP_P,
                stream: false
            };

            const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.OPENROUTER_API_KEY}`,
                    'HTTP-Referer': CONFIG.APP_URL,
                    'X-Title': CONFIG.APP_NAME,
                },
                body: JSON.stringify(body),
                signal: abortController.signal
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                const msg = err.error?.message || `HTTP ${res.status}`;
                if (res.status === 401) throw new Error('API Key tidak valid.');
                if (res.status === 402) throw new Error('Kredit habis.');
                if (res.status === 429) throw new Error('Terlalu banyak request. Tunggu sejenak.');
                if (res.status === 503) throw new Error('Model sedang sibuk. Coba lagi nanti.');
                throw new Error(msg);
            }

            const data = await res.json();
            const reply = data.choices?.[0]?.message?.content || '';
            if (!reply.trim()) throw new Error('Respons kosong. Coba tanyakan ulang.');
            return reply;
        }

        async function sendMessage() {
            if (isProcessing) return;
            const msg = userInput.value.trim();
            if (!msg) return;

            hideWelcome();
            addMsg(msg, true);
            conversationHistory.push({ role: 'user', content: msg });
            userInput.value = '';
            userInput.style.height = 'auto';
            userInput.focus();
            setLoading(true);
            showTyping();

            try {
                const reply = await callAPI(msg);
                hideTyping();
                addMsg(reply, false);
                conversationHistory.push({ role: 'assistant', content: reply });
                saveHistory();
                if (conversationHistory.length > 32) {
                    conversationHistory = [conversationHistory[0], ...conversationHistory.slice(-30)];
                }
            } catch (e) {
                console.error(e);
                hideTyping();
                if (e.name === 'AbortError') return;
                addMsg(`Maaf, terjadi kendala: ${e.message}\n\nSilakan coba lagi.`, false);
                if (conversationHistory.at(-1)?.role === 'user') conversationHistory.pop();
                toast('Gagal mengirim', 'error');
            } finally {
                setLoading(false);
                abortController = null;
                userInput.focus();
            }
        }

        function saveHistory() {
            try {
                localStorage.setItem('rexzai_conv', JSON.stringify(conversationHistory.slice(1)));
                const msgs = [];
                chatContainer.querySelectorAll('.message').forEach(m => {
                    if (m.id === 'typingIndicator') return;
                    const b = m.querySelector('.bubble');
                    if (b) msgs.push({ c: b.textContent, u: m.classList.contains('user') });
                });
                localStorage.setItem('rexzai_disp', JSON.stringify(msgs));
            } catch (_) {}
        }

        function loadHistory() {
            try {
                const c = localStorage.getItem('rexzai_conv');
                if (c) {
                    const p = JSON.parse(c);
                    if (Array.isArray(p) && p.length) conversationHistory = [conversationHistory[0], ...p];
                }
                const d = localStorage.getItem('rexzai_disp');
                if (d) {
                    const msgs = JSON.parse(d);
                    if (Array.isArray(msgs) && msgs.length) {
                        hideWelcome();
                        msgs.forEach(m => addMsg(m.c, m.u));
                    }
                }
            } catch (_) {}
        }

        function clearChat() {
            if (isProcessing) { toast('Tunggu proses selesai', 'error'); return; }
            conversationHistory = [{ role: 'system', content: CONFIG.SYSTEM_PROMPT }];
            chatContainer.innerHTML = `
                <div class="welcome-wrap" id="welcomeMsg">
                    <div class="welcome-pfp"><img src="pfp.jpg" alt="RexzAI" onerror="this.style.display='none'"></div>
                    <div class="welcome-title">Chat Baru</div>
                    <div class="welcome-desc">Percakapan direset. Silakan mulai diskusi baru.</div>
                    <div class="suggestions">
                        <span class="chip" onclick="sendSuggestion(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Apa itu AI?</span>
                        <span class="chip" onclick="sendSuggestion(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Kode Python</span>
                        <span class="chip" onclick="sendSuggestion(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Puisi singkat</span>
                        <span class="chip" onclick="sendSuggestion(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Tips produktif</span>
                    </div>
                </div>`;
            window.welcomeMsg = document.getElementById('welcomeMsg');
            localStorage.removeItem('rexzai_conv');
            localStorage.removeItem('rexzai_disp');
            toast('Chat direset', 'success');
            userInput.focus();
        }

        function exportChat() {
            const msgs = chatContainer.querySelectorAll('.message');
            if (!msgs.length || (msgs.length === 1 && msgs[0].id === 'typingIndicator')) { toast('Belum ada chat', 'error'); return; }
            let t = 'REXZAI CHAT EXPORT\nNVIDIA Nemotron Ultra 550B\n' + '─'.repeat(36) + '\n\n';
            t += `Tanggal: ${new Date().toLocaleString('id-ID')}\n\n`;
            msgs.forEach(m => {
                if (m.id === 'typingIndicator') return;
                const b = m.querySelector('.bubble');
                const meta = m.querySelector('.msg-meta');
                if (b) t += `[${meta?.textContent?.trim() || ''}] ${m.classList.contains('user') ? 'You' : 'RexzAI'}:\n${b.textContent}\n\n`;
            });
            const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rexzai-${new Date().toISOString().slice(0,10)}.txt`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            toast('Chat diexport', 'success');
        }

        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); clearChat(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'e') { e.preventDefault(); exportChat(); }
        });
    </script>
</body>
</html>
